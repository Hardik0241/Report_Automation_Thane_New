name: Report Automation Scheduler - Thane New

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 9-14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_THANENEW }}
      SALES_SPREADSHEET_ID: 1bAxmZHCByQMPKGZ4Qi2bYzk2NuC3_cLPfgGP5S76VVE
      CLIENT_ID: ${{ secrets.THANENEW_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.THANENEW_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.THANENEW_REFRESH_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Debug - Confirm folder name
        run: |
          echo "=== Exact folder names ==="
          ls -la
          echo "=== Entering folder with space ==="
          cd "Working_Report_Editor " || echo "Cannot cd into folder"
          ls -la

      - name: Debug - Check SALES_SPREADSHEET_ID
        run: |
          echo "=== SALES_SPREADSHEET_ID ==="
          if [ -n "$SALES_SPREADSHEET_ID" ]; then
            echo "✅ SALES_SPREADSHEET_ID is set!"
            echo "Length: ${#SALES_SPREADSHEET_ID}"
          else
            echo "❌ SALES_SPREADSHEET_ID is EMPTY!"
          fi

      - name: Debug - Check Service Account Email
        run: |
          echo "=== Service Account Email from GOOGLE_CREDENTIALS ==="
          python3 -c "
import json
import os
creds_json = os.environ.get('GOOGLE_CREDENTIALS', '')
if creds_json:
    try:
        creds = json.loads(creds_json)
        print(f'client_email: {creds.get(\"client_email\", \"NOT FOUND\")}')
        print(f'project_id: {creds.get(\"project_id\", \"NOT FOUND\")}')
    except Exception as e:
        print(f'Error parsing JSON: {e}')
else:
    print('GOOGLE_CREDENTIALS is empty!')
"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          cd "Working_Report_Editor "
          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt found!"
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found!"
            ls -la
            exit 1
          fi

      - name: Create test script
        run: |
          cd "Working_Report_Editor "
          cat > test_sheets.py << 'EOF'
import os
import json
import gspread
from google.oauth2 import service_account

print("=== TESTING GOOGLE SHEETS CONNECTION ===")

creds_json = os.environ.get("GOOGLE_CREDENTIALS", "")
if not creds_json:
    print("❌ GOOGLE_CREDENTIALS is empty!")
    exit(1)

try:
    creds_dict = json.loads(creds_json)
    print(f"✅ client_email: {creds_dict.get('client_email', 'NOT FOUND')}")
    print(f"✅ project_id: {creds_dict.get('project_id', 'NOT FOUND')}")
except Exception as e:
    print(f"❌ Failed to parse JSON: {e}")
    exit(1)

try:
    print("\n🔄 Attempting to connect to Google Sheets...")
    scopes = ["https://www.googleapis.com/auth/spreadsheets"]
    creds = service_account.Credentials.from_service_account_info(creds_dict, scopes=scopes)
    client = gspread.authorize(creds)
    print("✅ Client created successfully!")

    sheet_id = os.environ.get("SALES_SPREADSHEET_ID", "")
    if not sheet_id:
        print("❌ SALES_SPREADSHEET_ID is empty!")
        exit(1)

    print(f"🔄 Attempting to open sheet: {sheet_id}")
    sheet = client.open_by_key(sheet_id)
    print(f"✅ Success! Sheet title: {sheet.title}")

    worksheets = sheet.worksheets()
    print(f"✅ Found {len(worksheets)} worksheets:")
    for ws in worksheets:
        print(f"   - {ws.title}")

except Exception as e:
    print(f"❌ ERROR: {type(e).__name__}: {e}")
    exit(1)

print("\n=== TEST COMPLETE ===")
EOF

      - name: Test Google Sheets Connection
        run: |
          cd "Working_Report_Editor "
          python test_sheets.py

      - name: Create logs directory
        run: |
          mkdir -p "Working_Report_Editor /logs"
          mkdir -p "Working_Report_Editor /attachments"

      - name: Run processor
        run: |
          cd "Working_Report_Editor "
          if [ -f "main.py" ]; then
            echo "✅ main.py found!"
            python main.py
          else
            echo "❌ main.py not found!"
            ls -la
            exit 1
          fi

      - name: Commit and push logs
        run: |
          cd "Working_Report_Editor "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          touch logs/processing_logs.csv
          git add -f logs/processing_logs.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update processing logs [skip ci]"
            git push
            echo "Logs committed to repository"
          fi
