name: Report Automation Scheduler - Thane New

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Runs at 0 and 30 minutes past each hour from 3:00 PM to 8:30 PM IST (Mon-Sat)
    # IST 3:00 PM = UTC 09:30, IST 8:30 PM = UTC 15:00
    # Hours 9-14 UTC cover: 3:00 PM to 8:30 PM IST
    - cron: '0,30 9-14 * * 1-6'
    
    # Final run at 9:00 PM IST (deadline)
    # IST 9:00 PM = UTC 15:30
    - cron: '30 15 * * 1-6'

  workflow_dispatch:
    # Allow manual trigger with optional date input
    inputs:
      force_date:
        description: 'Enter date (dd-mm-yyyy) to process emails from that specific date. Leave empty for today.'
        required: false
        type: string
        default: ''
        placeholder: 'e.g., 28-08-2026'

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          cd "Working_Report_Editor "
          if [ -f "requirements.txt" ]; then
            echo "✅ requirements.txt found!"
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found!"
            ls -la
            exit 1
          fi

      - name: Create logs directory
        run: |
          mkdir -p "Working_Report_Editor /logs"
          mkdir -p "Working_Report_Editor /attachments"

      - name: Run processor
        run: |
          cd "Working_Report_Editor "
          if [ -f "main.py" ]; then
            echo "✅ main.py found!"
            python main.py
          else
            echo "❌ main.py not found!"
            ls -la
            exit 1
          fi
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_THANENEW }}
          SALES_SPREADSHEET_ID: ${{ secrets.THANENEW_SALES_SPREADSHEET_ID }}
          THANENEW_CLIENT_ID: ${{ secrets.THANENEW_CLIENT_ID }}
          THANENEW_CLIENT_SECRET: ${{ secrets.THANENEW_CLIENT_SECRET }}
          THANENEW_REFRESH_TOKEN: ${{ secrets.THANENEW_REFRESH_TOKEN }}
          # Pass the manual input (if set) as FORCE_DATE (optional)
          FORCE_DATE: ${{ github.event.inputs.force_date }}
