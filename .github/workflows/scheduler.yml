name: Report Automation Scheduler - Thane New

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 9-14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug - Show files after checkout
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== All files in root ==="
          ls -la
          echo "=== Check if Working_Report_Editor exists ==="
          if [ -d "Working_Report_Editor" ]; then
            echo "✅ Working_Report_Editor exists!"
            ls -la Working_Report_Editor/
          else
            echo "❌ Working_Report_Editor does NOT exist!"
            echo "=== Creating Working_Report_Editor as fallback ==="
            mkdir -p Working_Report_Editor
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        working-directory: Working_Report_Editor
        run: |
          pip install -r requirements.txt

      - name: Create logs directory
        run: |
          mkdir -p Working_Report_Editor/logs
          mkdir -p Working_Report_Editor/attachments

      - name: Run processor
        working-directory: Working_Report_Editor
        run: python main.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_THANENEW }}
          SALES_SPREADSHEET_ID: ${{ secrets.THANENEW_SALES_SPREADSHEET_ID }}
          CLIENT_ID: ${{ secrets.THANENEW_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.THANENEW_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.THANENEW_REFRESH_TOKEN }}

      - name: Debug - Check logs
        run: |
          echo "=== Checking logs directory ==="
          ls -la Working_Report_Editor/logs/ || echo "Logs directory not found"

      - name: Commit and push logs
        run: |
          cd Working_Report_Editor
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          touch logs/processing_logs.csv
          git add -f logs/processing_logs.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update processing logs [skip ci]"
            git push
            echo "Logs committed to repository"
          fi
