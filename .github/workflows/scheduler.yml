name: Report Automation Scheduler - Thane New

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 9-14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Debug - Show branch and files
        run: |
          echo "=== Current branch ==="
          git branch
          echo "=== Last commit ==="
          git log -1
          echo "=== Contents of root ==="
          ls -la
          echo "=== Contents of Working_Report_Editor ==="
          ls -la Working_Report_Editor/ || echo "Folder not found!"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: |
          if [ -f "Working_Report_Editor/requirements.txt" ]; then
            echo "✅ Installing from Working_Report_Editor"
            pip install -r Working_Report_Editor/requirements.txt
          elif [ -f "requirements.txt" ]; then
            echo "✅ Installing from root"
            pip install -r requirements.txt
          else
            echo "❌ requirements.txt not found!"
            echo "=== Full tree ==="
            find . -type f | sort
            exit 1
          fi

      - name: Create logs directory
        run: |
          mkdir -p Working_Report_Editor/logs
          mkdir -p Working_Report_Editor/attachments

      - name: Run processor
        run: |
          if [ -f "Working_Report_Editor/main.py" ]; then
            echo "✅ Running from Working_Report_Editor"
            cd Working_Report_Editor
            python main.py
          elif [ -f "main.py" ]; then
            echo "✅ Running from root"
            python main.py
          else
            echo "❌ main.py not found!"
            echo "=== Full tree ==="
            find . -type f | sort
            exit 1
          fi
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_THANENEW }}
          SALES_SPREADSHEET_ID: ${{ secrets.THANENEW_SALES_SPREADSHEET_ID }}
          CLIENT_ID: ${{ secrets.THANENEW_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.THANENEW_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.THANENEW_REFRESH_TOKEN }}

      - name: Commit and push logs
        run: |
          cd Working_Report_Editor
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p logs
          touch logs/processing_logs.csv
          git add -f logs/processing_logs.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update processing logs [skip ci]"
            git push
            echo "Logs committed to repository"
          fi
