name: Report Automation Scheduler - Thane New

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 9-14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        working-directory: Working_Report_Editor
        run: |
          pip install -r requirements.txt

      - name: Create logs directory
        run: |
          mkdir -p Working_Report_Editor/logs
          mkdir -p Working_Report_Editor/attachments

      - name: Run processor
        working-directory: Working_Report_Editor
        run: python main.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_THANENEW }}
          SALES_SPREADSHEET_ID: ${{ secrets.THANENEW_SALES_SPREADSHEET_ID }}
          CLIENT_ID: ${{ secrets.THANENEW_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.THANENEW_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.THANENEW_REFRESH_TOKEN }}

      - name: Debug - Check if logs file exists
        run: |
          echo "=== Checking logs directory ==="
          ls -la Working_Report_Editor/logs/ || echo "Logs directory not found"
          echo ""
          echo "=== Checking processing_logs.csv ==="
          if [ -f Working_Report_Editor/logs/processing_logs.csv ]; then
            echo "File exists! Contents:"
            cat Working_Report_Editor/logs/processing_logs.csv
          else
            echo "File does not exist yet"
          fi

      - name: Commit and push logs to repository
        run: |
          cd Working_Report_Editor
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p logs
          touch logs/processing_logs.csv
          git add -f logs/processing_logs.csv
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update processing logs [skip ci]"
            git push
            echo "Logs committed to repository"
          fi
